<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mimamori - 新生児モニタリング</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card-bg: #fff;
      --primary: #1a2332;
      --primary-light: #2c3e50;
      --accent: #4a90d9;
      --accent-hover: #3a7bc8;
      --danger: #e74c3c;
      --danger-hover: #c0392b;
      --danger-light: #fde8e8;
      --success: #27ae60;
      --success-hover: #219a52;
      --warning: #e67e22;
      --warning-hover: #d35400;
      --text: #2c3e50;
      --text-light: #5a6a7a;
      --text-muted: #95a5a6;
      --border: #e8ecf1;
      --border-dark: #d5dbe3;
      --tag-bg: #e8f4fd;
      --tag-text: #2980b9;
      --radius: 10px;
      --radius-sm: 6px;
      --tap-size: 44px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .header h1 { font-size: 1.1em; font-weight: 700; letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 0.85em; opacity: 0.9; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #2ecc71;
      display: inline-block; margin-right: 6px;
      box-shadow: 0 0 6px rgba(46,204,113,0.5);
    }
    .status-dot.active { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(46,204,113,0.5); }
      50% { box-shadow: 0 0 12px rgba(46,204,113,0.8); }
    }
    .rec-badge {
      background: var(--danger); color: #fff; padding: 2px 8px;
      border-radius: 4px; font-size: 0.75em; font-weight: 700;
      display: none; animation: recBlink 1s infinite;
    }
    @keyframes recBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    /* Alert */
    .alert-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
      color: #fff; padding: 10px 16px; display: none;
      font-weight: 600; font-size: 0.9em;
      box-shadow: 0 2px 8px rgba(231,76,60,0.3);
      transition: opacity 0.3s ease;
    }
    /* Main layout */
    .main { display: flex; flex-direction: column; gap: 12px; padding: 12px; max-width: 1200px; margin: 0 auto; }
    .card {
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: var(--shadow-lg); }
    .card h2 {
      font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px; color: var(--text-muted);
      border-bottom: 2px solid var(--border); padding-bottom: 8px;
    }
    /* Video */
    .video-frame { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; border-radius: var(--radius-sm); background: #111; }
    .video-frame img {
      position: absolute; top: 50%; left: 50%; height: 100%; aspect-ratio: 4/3; object-fit: cover;
      transform: translate(-50%, -50%) rotate(var(--preview-rotate, 90deg)) scale(var(--preview-scale, 1));
      margin-left: var(--preview-offset-x, 0px); margin-top: var(--preview-offset-y, 0px);
    }
    .controls-bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    /* Results */
    .result-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .result-item:last-child { border-bottom: none; }
    .result-label { font-weight: 600; color: var(--text-light); font-size: 0.9em; }
    .result-value { text-align: right; flex: 1; margin-left: 12px; }
    .anomaly { color: var(--danger); font-weight: 700; }
    .action-tag {
      display: inline-block; background: var(--tag-bg); color: var(--tag-text);
      padding: 3px 10px; border-radius: 20px; font-size: 0.8em; margin: 2px;
      font-weight: 500;
    }
    .confidence-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 0.8em; font-weight: 600;
    }
    .confidence-high { background: #e8f8f0; color: var(--success); }
    .confidence-medium { background: #fef5e7; color: var(--warning); }
    .confidence-low { background: var(--danger-light); color: var(--danger); }
    /* Buttons */
    .btn {
      min-height: var(--tap-size); min-width: var(--tap-size);
      padding: 10px 16px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.85em; font-weight: 600; touch-action: manipulation;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97) translateY(0); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-warning { background: var(--warning); }
    .btn-warning:hover { background: var(--warning-hover); }
    .btn-sm { min-height: 36px; padding: 6px 14px; }
    .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #fff; }
    /* Settings */
    details { margin-bottom: 0; }
    details summary {
      font-size: 0.95em; font-weight: 600; color: var(--text);
      cursor: pointer; padding: 10px 0;
      list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    details + details { border-top: 1px solid var(--border); }
    details summary::after { content: '\25B6'; font-size: 0.65em; color: var(--text-muted); transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(90deg); }
    details summary::-webkit-details-marker { display: none; }
    .settings-section { padding: 12px 0 4px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85em; color: var(--text-light); }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-sm); font-size: 1em; min-height: var(--tap-size);
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }
    .form-row-inline { display: flex; gap: 8px; align-items: flex-end; }
    .form-row-inline .form-group { flex: 1; margin-bottom: 0; }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    /* Camera controls */
    .cam-toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .cam-toggle { min-width: auto; padding: 8px 14px; font-size: 0.8em; }
    .cam-toggle.on { background: var(--success); }
    .cam-slider { margin-bottom: 10px; }
    .cam-slider label { font-size: 0.85em; font-weight: 600; color: var(--text-light); display: flex; justify-content: space-between; margin-bottom: 4px; }
    .cam-slider input[type=range] { width: 100%; min-height: var(--tap-size); }
    .cam-slider select { width: 100%; padding: 8px; border: 1.5px solid var(--border-dark); border-radius: var(--radius-sm); min-height: var(--tap-size); }
    /* History */
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-row {
      display: grid; grid-template-columns: auto 1fr auto;
      gap: 8px; align-items: center; padding: 8px 10px;
      background: var(--bg); border-radius: var(--radius-sm); font-size: 0.85em;
      border-left: 3px solid var(--accent); cursor: pointer;
      transition: background 0.15s;
    }
    .history-row:hover { background: var(--border); }
    .history-row.has-anomaly { border-left-color: var(--danger); background: #fef9f9; }
    .history-row.has-anomaly:hover { background: #fde8e8; }
    .history-row-time { font-weight: 600; color: var(--text-muted); font-size: 0.8em; white-space: nowrap; }
    .history-row-body { min-width: 0; }
    .history-row-summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-row-detail {
      display: none; grid-column: 1 / -1; padding: 8px 10px 4px;
      border-top: 1px solid var(--border); font-size: 0.95em; line-height: 1.6;
    }
    .history-row.expanded { grid-template-rows: auto auto; }
    .history-row.expanded .history-row-detail { display: block; }
    .history-row.expanded .history-row-summary { white-space: normal; overflow: visible; }
    .history-row-detail-item { margin-bottom: 4px; }
    .history-row-detail-label { font-weight: 600; color: var(--text-muted); margin-right: 6px; }
    .history-row-meta { font-size: 0.75em; color: var(--text-light); }
    .history-pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 8px; font-size: 0.85em; }
    .history-pager button { min-height: 36px; min-width: 36px; }
    .no-data { color: var(--text-muted); font-style: italic; padding: 24px 0; text-align: center; }
    /* Tab bar */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
      background: var(--card-bg); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }
    .tab-bar button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; cursor: pointer; padding: 8px 0 6px;
      color: var(--text-muted); font-size: 0.7em; font-weight: 600;
      touch-action: manipulation; transition: color 0.15s;
    }
    .tab-bar button .tab-icon { font-size: 1.6em; line-height: 1; }
    .tab-bar button.active { color: var(--accent); }
    body { padding-bottom: 64px; }
    /* Tab content */
    .tab-content { display: none; }
    .tab-content.active { display: contents; }
    /* Sleep timeline */
    .timeline-card { margin-top: 12px; }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .timeline-header .timeline-date { font-weight: 600; font-size: 0.9em; }
    .timeline-header .timeline-total { font-size: 0.85em; color: var(--text-muted); }
    .timeline-bar {
      position: relative; height: 32px; background: var(--bg);
      border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 4px;
    }
    .timeline-block {
      position: absolute; top: 0; height: 100%;
      background: var(--accent); opacity: 0.7; border-radius: 2px;
      min-width: 2px; cursor: default;
    }
    .timeline-block.active {
      opacity: 1;
      animation: timelinePulse 2s infinite;
    }
    @keyframes timelinePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .timeline-now {
      position: absolute; top: -4px; bottom: -4px; width: 2px;
      background: var(--danger); z-index: 2;
    }
    .timeline-now::after {
      content: ''; position: absolute; top: -3px; left: -3px;
      width: 8px; height: 8px; background: var(--danger);
      border-radius: 50%;
    }
    .timeline-labels {
      display: flex; justify-content: space-between;
      font-size: 0.7em; color: var(--text-muted); padding: 0 1px;
    }
    .timeline-summary {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.75em; color: var(--text-muted); margin-top: 6px;
    }
    .timeline-legend { display: flex; align-items: center; gap: 4px; }
    .timeline-legend-box {
      width: 12px; height: 12px; border-radius: 2px;
      background: var(--accent); opacity: 0.7;
    }
    /* Toast */
    .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast {
      background: var(--primary); color: #fff; padding: 12px 24px;
      border-radius: var(--radius); font-size: 0.9em; font-weight: 500;
      box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease; pointer-events: auto;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    /* Desktop: single-screen layout without tabs */
    @media (min-width: 1024px) {
      body { padding-bottom: 0; overflow: hidden; font-size: 18px; }
      .tab-bar { display: none; }
      .tab-content { display: contents !important; }
      .header { padding: 10px 20px; }
      .header h1 { font-size: 1.3em; }
      .header-right { font-size: 1.05em; }
      .alert-banner { font-size: 1em; padding: 8px 20px; }
      .main {
        display: grid;
        grid-template-columns: 2fr 3fr 3fr;
        grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
        gap: 14px; padding: 14px;
        max-width: none;
        height: calc(100vh - 48px);
        overflow: hidden;
      }
      .main > .tab-content { display: contents !important; }
      /* Left column: video spanning full height (portrait) */
      .video-container { grid-column: 1; grid-row: 1 / -1; display: flex; flex-direction: column; overflow: hidden; }
      .video-frame { flex: 1; min-height: 0; aspect-ratio: auto; }
      .cam-controls-container { display: none; }
      /* Center column: analysis + history stacked */
      .result-container { grid-column: 2; grid-row: 1; overflow-y: auto; }
      .history-container { grid-column: 2; grid-row: 2; overflow-y: auto; }
      /* Right column: sleep + settings stacked */
      .sleep-container { grid-column: 3; grid-row: 1; overflow-y: auto; }
      .settings-container { grid-column: 3; grid-row: 2; overflow-y: auto; }
      /* Card sizing */
      .card { padding: 16px; }
      .card h2 { margin-bottom: 10px; padding-bottom: 8px; font-size: 1em; letter-spacing: 1.5px; }
      /* Analysis */
      .result-item { padding: 8px 0; }
      .result-label { font-size: 1.05em; }
      .result-value { font-size: 1.05em; }
      .confidence-badge { font-size: 0.95em; padding: 3px 12px; }
      .action-tag { font-size: 0.95em; padding: 4px 12px; }
      /* History */
      .history-row { font-size: 1em; padding: 10px 12px; }
      .history-row-time { font-size: 0.95em; }
      .history-row-meta { font-size: 0.85em; }
      .history-row-detail { font-size: 0.95em; }
      .history-row-detail .action-tag { font-size: 0.9em; }
      .history-pager { font-size: 1em; }
      /* Sleep timeline */
      .timeline-bar { height: 32px; }
      .timeline-header .timeline-date { font-size: 1.1em; }
      .timeline-header .timeline-total { font-size: 1em; }
      .timeline-labels { font-size: 0.85em; }
      .timeline-summary { font-size: 0.9em; }
      /* Settings */
      .form-group label { font-size: 1em; }
      .form-group input, .form-group select { min-height: 40px; padding: 8px 12px; font-size: 1em; }
      .form-row-inline .form-group { max-width: 300px; }
      details summary { font-size: 1.1em; padding: 12px 0; }
      .form-actions .btn { font-size: 1em; }
      /* Buttons */
      .btn { font-size: 1em; padding: 8px 16px; }
      .btn-sm { font-size: 0.95em; }
      .controls-bar { margin-top: 12px; }
      /* Toast */
      .toast-container { bottom: 20px; }
      .toast { font-size: 1.05em; }
      .no-data { font-size: 1em; }
    }
    /* Tablet: 2-column layout, still with tabs */
    @media (min-width: 768px) and (max-width: 1023px) {
      .main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
      .video-container { grid-column: 1 / 2; }
      .result-container { grid-column: 2 / 3; }
      .cam-controls-container { grid-column: 1 / -1; }
      .cam-controls-container .cam-inner { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: start; }
      .sleep-container { grid-column: 1 / -1; }
      .history-container, .settings-container { grid-column: 1 / -1; }
      .form-row-inline .form-group { max-width: 300px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="status-dot active" id="statusDot"></span>mimamori</h1>
    <div class="header-right">
      <span class="rec-badge" id="recBadge">REC</span>
      <span id="lastUpdate">--</span>
    </div>
  </div>
  <div class="alert-banner" id="alertBanner"></div>
  <div class="main">
    <div class="tab-content active" id="tabMonitor">
    <div class="card video-container">
      <h2>Live</h2>
      <div class="video-frame"><img src="/stream" alt="Live Stream" id="liveStream" onerror="retryStream(this)"></div>
      <div class="controls-bar">
        <button class="btn btn-danger btn-sm" id="streamToggleBtn" onclick="toggleStream()">映像停止</button>
        <button class="btn btn-danger btn-sm" id="analysisToggleBtn" onclick="toggleAnalysis()">解析停止</button>
        <button class="btn btn-warning btn-sm" id="recordToggleBtn" onclick="toggleRecording()">録画開始</button>
      </div>
    </div>
    <div class="card result-container">
      <h2>Analysis</h2>
      <div id="resultArea">
        <div class="no-data">解析結果を待っています...</div>
      </div>
    </div>
    <div class="card cam-controls-container" id="camControlsCard" style="display:none">
      <h2>Camera</h2>
      <div class="cam-inner">
        <div class="cam-toggles">
          <button class="btn btn-sm cam-toggle" id="torchBtn" onclick="camCmd('/enabletorch','/disabletorch','torchBtn','torch')">Light</button>
          <button class="btn btn-sm cam-toggle" id="nightBtn" onclick="camCmd('/settings/night_vision?set=on','/settings/night_vision?set=off','nightBtn','night_vision')">Night</button>
          <button class="btn btn-sm cam-toggle" id="ffcBtn" onclick="camCmd('/settings/ffc?set=on','/settings/ffc?set=off','ffcBtn','ffc')">Front</button>
          <button class="btn btn-sm btn-outline cam-toggle" onclick="camSend('/focus')">AF</button>
        </div>
        <div>
          <div class="cam-slider">
            <label>Zoom <span id="zoomVal">1.0x</span></label>
            <input type="range" id="zoomSlider" min="100" max="800" step="7" value="100" oninput="camSend('/ptz?zoom='+this.value);document.getElementById('zoomVal').textContent=(this.value/100).toFixed(1)+'x'">
          </div>
          <div class="cam-slider">
            <label>Quality <span id="qualVal">50%</span></label>
            <input type="range" id="qualSlider" min="1" max="100" value="50" oninput="camSend('/settings/quality?set='+this.value);document.getElementById('qualVal').textContent=this.value+'%'">
          </div>
          <div class="cam-slider">
            <label>Resolution</label>
            <select id="resSelect" onchange="camSend('/settings/video_size?set='+this.value)"></select>
          </div>
        </div>
      </div>
    </div>
    <div class="card history-container">
      <h2>History</h2>
      <div class="history-list" id="historyList"><div class="no-data">履歴なし</div></div>
      <div class="history-pager" id="historyPager" style="display:none">
        <button class="btn btn-outline btn-sm" onclick="historyPrev()">&lt;</button>
        <span id="historyPageInfo">1 / 1</span>
        <button class="btn btn-outline btn-sm" onclick="historyNext()">&gt;</button>
      </div>
    </div>
    </div><!-- /tabMonitor -->
    <div class="tab-content" id="tabSleep">
    <div class="card sleep-container">
      <h2>Sleep</h2>
      <div id="sleepStatus"><div class="no-data">睡眠データなし</div></div>
      <div class="timeline-card">
        <div class="timeline-header">
          <span class="timeline-date" id="timelineDate"></span>
          <span class="timeline-total" id="timelineTotal"></span>
        </div>
        <div class="timeline-bar" id="timelineBar"></div>
        <div class="timeline-labels">
          <span>0</span><span>3</span><span>6</span><span>9</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
        </div>
        <div class="timeline-summary">
          <span class="timeline-legend"><span class="timeline-legend-box"></span>睡眠</span>
          <span class="timeline-legend"><span class="timeline-legend-box" style="background:var(--danger);opacity:1;width:2px;height:12px"></span>現在</span>
        </div>
      </div>
      <div class="history-list" id="sleepHistory" style="margin-top:10px"></div>
    </div>
    </div><!-- /tabSleep -->
    <div class="tab-content" id="tabSettings">
    <div class="card settings-container">
      <h2>Settings</h2>
      <details id="settingsAnalysis" open>
        <summary>解析設定</summary>
        <div class="settings-section">
          <div class="form-group">
            <label>解析間隔（秒）</label>
            <input type="number" id="intervalInput" min="1" max="300" value="5">
          </div>
          <div class="form-group">
            <label>LLM プロバイダ</label>
            <select id="providerSelect">
              <option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option>
            </select>
          </div>
          <div class="form-group">
            <label>モデル名</label>
            <input type="text" id="modelInput" value="">
          </div>
          <div class="form-actions">
            <button class="btn" onclick="saveAnalysisSettings()">保存</button>
          </div>
        </div>
      </details>
      <details id="settingsCamera">
        <summary>カメラ設定</summary>
        <div class="settings-section">
          <div class="form-group">
            <label>カメラ URL</label>
            <div class="form-row-inline">
              <div class="form-group"><input type="text" id="cameraUrlInput" placeholder="http://192.168.x.x:8080"></div>
              <button class="btn btn-outline btn-sm" onclick="swapCameraUrl()">切替</button>
            </div>
          </div>
          <div class="form-group">
            <label>デバイスインデックス</label>
            <div class="form-row-inline">
              <div class="form-group"><input type="number" id="deviceIndexInput" min="0" max="10" value="0"></div>
              <button class="btn btn-outline btn-sm" onclick="swapCameraDevice()">切替</button>
            </div>
          </div>
          <div class="form-row-inline" style="margin-top:12px;">
            <div class="form-group"><label>幅</label><input type="number" id="captureWidthInput" min="160" max="3840" value="640"></div>
            <div class="form-group"><label>高さ</label><input type="number" id="captureHeightInput" min="120" max="2160" value="480"></div>
            <button class="btn btn-outline btn-sm" onclick="saveCaptureSize()">保存</button>
          </div>
        </div>
      </details>
      <details id="settingsPreview">
        <summary>映像表示設定</summary>
        <div class="settings-section">
          <div class="cam-slider">
            <label>回転 <span id="previewRotateVal">90°</span></label>
            <input type="range" id="previewRotateSlider" min="0" max="360" step="1" value="90" oninput="updatePreview()">
          </div>
          <div class="cam-slider">
            <label>拡大 <span id="previewScaleVal">100%</span></label>
            <input type="range" id="previewScaleSlider" min="50" max="200" step="5" value="100" oninput="updatePreview()">
          </div>
          <div class="cam-slider">
            <label>水平位置 <span id="previewOffsetXVal">0</span></label>
            <input type="range" id="previewOffsetXSlider" min="-50" max="50" step="1" value="0" oninput="updatePreview()">
          </div>
          <div class="cam-slider">
            <label>垂直位置 <span id="previewOffsetYVal">0</span></label>
            <input type="range" id="previewOffsetYSlider" min="-50" max="50" step="1" value="0" oninput="updatePreview()">
          </div>
          <div class="form-actions">
            <button class="btn btn-outline btn-sm" onclick="resetPreview()">リセット</button>
          </div>
        </div>
      </details>
    </div>
    </div><!-- /tabSettings -->
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <nav class="tab-bar" id="tabBar">
    <button class="active" onclick="switchTab('monitor')"><span class="tab-icon">&#x1F441;</span>モニター</button>
    <button onclick="switchTab('sleep')"><span class="tab-icon">&#x1F319;</span>睡眠</button>
    <button onclick="switchTab('settings')"><span class="tab-icon">&#x2699;</span>設定</button>
  </nav>
  <script>
    /* -- Tab navigation (mobile only) -- */
    var currentTab = 'monitor';
    function isDesktop() { return window.innerWidth >= 1024; }
    function switchTab(tab) {
      if (isDesktop()) return;
      currentTab = tab;
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
      document.querySelectorAll('.tab-bar button').forEach(function(el) { el.classList.remove('active'); });
      var tabMap = { monitor: 'tabMonitor', sleep: 'tabSleep', settings: 'tabSettings' };
      document.getElementById(tabMap[tab]).classList.add('active');
      var btns = document.querySelectorAll('.tab-bar button');
      var idx = { monitor: 0, sleep: 1, settings: 2 };
      btns[idx[tab]].classList.add('active');
      location.hash = tab;
      if (tab === 'monitor') { fetchHistory(); }
      if (tab === 'sleep') { fetchSleepStatus(); fetchSleepHistory(); }
      if (tab === 'settings') { loadSettings(); }
    }
    (function() {
      if (isDesktop()) return;
      var h = location.hash.replace('#', '');
      if (h === 'sleep' || h === 'settings') switchTab(h);
    })();
    /* -- Timeline -- */
    function renderTimeline(sessions, totalSleep) {
      var bar = document.getElementById('timelineBar');
      var now = new Date();
      var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var todayEnd = todayStart + 86400000;
      var dayMs = 86400000;
      document.getElementById('timelineDate').textContent = now.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' });
      document.getElementById('timelineTotal').textContent = '合計: ' + formatDuration(totalSleep);
      var html = '';
      sessions.forEach(function(s) {
        var start = new Date(s.start_time).getTime();
        var end = s.is_active ? now.getTime() : new Date(s.end_time).getTime();
        var clampStart = Math.max(start, todayStart);
        var clampEnd = Math.min(end, todayEnd);
        if (clampStart >= clampEnd) return;
        var leftPct = ((clampStart - todayStart) / dayMs * 100).toFixed(2);
        var widthPct = ((clampEnd - clampStart) / dayMs * 100).toFixed(2);
        var activeCls = s.is_active ? ' active' : '';
        var startStr = new Date(start).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        var endStr = s.is_active ? '現在' : new Date(end).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        var title = startStr + ' - ' + endStr + ' (' + formatDuration(s.duration_seconds) + ')';
        html += '<div class="timeline-block' + activeCls + '" style="left:' + leftPct + '%;width:' + widthPct + '%" title="' + title + '"></div>';
      });
      var nowPct = ((now.getTime() - todayStart) / dayMs * 100).toFixed(2);
      if (nowPct >= 0 && nowPct <= 100) {
        html += '<div class="timeline-now" style="left:' + nowPct + '%"></div>';
      }
      bar.innerHTML = html;
    }
    function formatTime(ts) { return new Date(ts).toLocaleTimeString('ja-JP'); }
    function showToast(msg, type) {
      type = type || 'success';
      var c = document.getElementById('toastContainer'), el = document.createElement('div');
      el.className = 'toast ' + type; el.textContent = msg;
      c.appendChild(el); setTimeout(function() { el.remove(); }, 3000);
    }
    function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function confidenceBadge(c) {
      var cls = c === 'high' ? 'confidence-high' : c === 'medium' ? 'confidence-medium' : 'confidence-low';
      return '<span class="confidence-badge ' + cls + '">' + escapeHtml(c) + '</span>';
    }
    var _streamRetryTimer = null;
    function retryStream(img) {
      if (_streamRetryTimer) return;
      _streamRetryTimer = setTimeout(function() {
        _streamRetryTimer = null;
        img.src = '/stream?t=' + Date.now();
      }, 2000);
    }
    function updateStreamUrl() {
      var img = document.getElementById('liveStream');
      img.src = '/stream';
    }
    async function loadSettings() {
      try {
        var r = await fetch('/api/settings'), d = await r.json();
        document.getElementById('intervalInput').value = d.analysis_interval_seconds;
        document.getElementById('cameraUrlInput').value = d.camera_url || '';
        document.getElementById('deviceIndexInput').value = d.camera_device_index;
        document.getElementById('captureWidthInput').value = d.capture_width;
        document.getElementById('captureHeightInput').value = d.capture_height;
        document.getElementById('modelInput').value = d.llm_model;
        var sel = document.getElementById('providerSelect');
        sel.value = d.llm_provider;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === 'openai') sel.options[i].disabled = !d.openai_available;
          if (sel.options[i].value === 'gemini') sel.options[i].disabled = !d.gemini_available;
        }
        updateStreamUrl();
      } catch (e) { /* ignore */ }
    }
    async function fetchStatus() {
      try {
        var r = await fetch('/api/status'), d = await r.json();
        var area = document.getElementById('resultArea'), banner = document.getElementById('alertBanner'), dot = document.getElementById('statusDot');
        if (!d.has_result) { dot.style.background = '#f39c12'; dot.style.boxShadow = '0 0 6px rgba(243,156,18,0.5)'; return; }
        dot.style.background = '#2ecc71'; dot.style.boxShadow = '0 0 6px rgba(46,204,113,0.5)';
        document.getElementById('lastUpdate').textContent = formatTime(d.timestamp);
        var h = '';
        h += '<div class="result-item"><span class="result-label">姿勢</span><span class="result-value">' + escapeHtml(d.posture) + '</span></div>';
        h += '<div class="result-item"><span class="result-label">睡眠状態</span><span class="result-value">' + escapeHtml(d.sleep_state) + '</span></div>';
        h += '<div class="result-item"><span class="result-label">要約</span><span class="result-value">' + escapeHtml(d.summary) + '</span></div>';
        h += '<div class="result-item"><span class="result-label">信頼度</span><span class="result-value">' + confidenceBadge(d.confidence) + '</span></div>';
        if (d.actions && d.actions.length > 0) {
          h += '<div class="result-item"><span class="result-label">動作</span><span class="result-value">' + d.actions.map(function(a) { return '<span class="action-tag">' + escapeHtml(a) + '</span>'; }).join('') + '</span></div>';
        }
        if (d.anomalies.length > 0) {
          h += '<div class="result-item"><span class="result-label">異常</span><span class="result-value anomaly">' + d.anomalies.map(escapeHtml).join(', ') + '</span></div>';
          banner.textContent = '\u26A0 異常検知: ' + d.anomalies.join(', ');
          banner.style.display = 'block'; banner.style.opacity = '1';
          clearTimeout(banner._hideTimer);
          banner._hideTimer = setTimeout(function() { banner.style.opacity = '0'; setTimeout(function() { banner.style.display = 'none'; }, 300); }, 10000);
        } else {
          h += '<div class="result-item"><span class="result-label">異常</span><span class="result-value" style="color:var(--success);">なし</span></div>';
          banner.style.display = 'none';
        }
        area.innerHTML = h;
      } catch (e) { document.getElementById('statusDot').style.background = '#e74c3c'; }
    }
    /* -- History with pagination -- */
    var historyItems = [], historyPage = 0, HISTORY_PER_PAGE = 5;
    async function fetchHistory() {
      try {
        var r = await fetch('/api/history'), d = await r.json();
        historyItems = d.items; historyPage = 0; renderHistory();
      } catch (e) { /* ignore */ }
    }
    function renderHistory() {
      var el = document.getElementById('historyList'), pager = document.getElementById('historyPager');
      if (historyItems.length === 0) { el.innerHTML = '<div class="no-data">履歴なし</div>'; pager.style.display = 'none'; return; }
      var pages = Math.ceil(historyItems.length / HISTORY_PER_PAGE);
      var start = historyPage * HISTORY_PER_PAGE, slice = historyItems.slice(start, start + HISTORY_PER_PAGE);
      el.innerHTML = slice.map(function(item) {
        var cls = item.anomalies.length > 0 ? 'history-row has-anomaly' : 'history-row';
        var anomaly = item.anomalies.length > 0 ? ' <span class="anomaly">' + item.anomalies.map(escapeHtml).join(', ') + '</span>' : '';
        var detail = '<div class="history-row-detail">';
        detail += '<div class="history-row-detail-item"><span class="history-row-detail-label">姿勢:</span>' + escapeHtml(item.posture) + '</div>';
        detail += '<div class="history-row-detail-item"><span class="history-row-detail-label">睡眠:</span>' + escapeHtml(item.sleep_state) + '</div>';
        if (item.actions && item.actions.length > 0) {
          detail += '<div class="history-row-detail-item"><span class="history-row-detail-label">動作:</span>' + item.actions.map(function(a) { return '<span class="action-tag">' + escapeHtml(a) + '</span>'; }).join(' ') + '</div>';
        }
        if (item.anomalies.length > 0) {
          detail += '<div class="history-row-detail-item"><span class="history-row-detail-label">異常:</span><span class="anomaly">' + item.anomalies.map(escapeHtml).join(', ') + '</span></div>';
        }
        detail += '</div>';
        return '<div class="' + cls + '" onclick="toggleHistoryDetail(this)"><span class="history-row-time">' + formatTime(item.timestamp) + '</span>' +
          '<div class="history-row-body"><div class="history-row-summary">' + escapeHtml(item.summary) + anomaly + '</div>' +
          '<div class="history-row-meta">' + escapeHtml(item.posture) + ' / ' + escapeHtml(item.sleep_state) + '</div></div>' +
          confidenceBadge(item.confidence) + detail + '</div>';
      }).join('');
      if (pages > 1) { pager.style.display = 'flex'; document.getElementById('historyPageInfo').textContent = (historyPage + 1) + ' / ' + pages; }
      else { pager.style.display = 'none'; }
    }
    function historyPrev() { if (historyPage > 0) { historyPage--; renderHistory(); } }
    function historyNext() { var pages = Math.ceil(historyItems.length / HISTORY_PER_PAGE); if (historyPage < pages - 1) { historyPage++; renderHistory(); } }
    function toggleHistoryDetail(el) { el.classList.toggle('expanded'); }
    async function saveAnalysisSettings() {
      var body = {}, interval = parseInt(document.getElementById('intervalInput').value);
      if (!isNaN(interval) && interval >= 1) body.analysis_interval_seconds = interval;
      body.llm_provider = document.getElementById('providerSelect').value;
      body.llm_model = document.getElementById('modelInput').value;
      try {
        var r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }), d = await r.json();
        document.getElementById('intervalInput').value = d.analysis_interval_seconds;
        document.getElementById('providerSelect').value = d.llm_provider;
        document.getElementById('modelInput').value = d.llm_model;
        showToast('解析設定を更新しました');
      } catch (e) { showToast('設定の更新に失敗しました', 'error'); }
    }
    async function saveCaptureSize() {
      var w = parseInt(document.getElementById('captureWidthInput').value), h = parseInt(document.getElementById('captureHeightInput').value), body = {};
      if (!isNaN(w) && w > 0) body.capture_width = w;
      if (!isNaN(h) && h > 0) body.capture_height = h;
      try {
        var r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }), d = await r.json();
        document.getElementById('captureWidthInput').value = d.capture_width;
        document.getElementById('captureHeightInput').value = d.capture_height;
        showToast('解像度設定を更新しました');
      } catch (e) { showToast('設定の更新に失敗しました', 'error'); }
    }
    var streamRunning = true;
    async function swapCameraUrl() {
      var url = document.getElementById('cameraUrlInput').value;
      if (!url) return;
      try { var r = await fetch('/api/camera/swap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ camera_url: url }) }), d = await r.json(); if (d.ok) { updateStreamUrl(); showToast('カメラを切り替えました'); } else showToast(d.message, 'error'); } catch (e) { showToast('カメラ切り替えに失敗しました', 'error'); }
    }
    async function swapCameraDevice() {
      var idx = parseInt(document.getElementById('deviceIndexInput').value);
      if (isNaN(idx) || idx < 0) return;
      try { var r = await fetch('/api/camera/swap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ camera_device_index: idx }) }), d = await r.json(); if (d.ok) { updateStreamUrl(); showToast('カメラを切り替えました'); } else showToast(d.message, 'error'); } catch (e) { showToast('カメラ切り替えに失敗しました', 'error'); }
    }
    async function toggleStream() {
      try { var r = await fetch(streamRunning ? '/api/stream/stop' : '/api/stream/start', { method: 'POST' }), d = await r.json();
        if (d.ok) { streamRunning = d.running; var b = document.getElementById('streamToggleBtn');
          if (streamRunning) { b.textContent = '映像停止'; b.className = 'btn btn-danger btn-sm'; showToast('ストリームを再開しました'); }
          else { b.textContent = '映像再開'; b.className = 'btn btn-success btn-sm'; showToast('ストリームを停止しました'); }
        }
      } catch (e) { showToast('ストリーム制御に失敗しました', 'error'); }
    }
    var isRecording = false;
    async function toggleRecording() {
      try { var r = await fetch(isRecording ? '/api/recording/stop' : '/api/recording/start', { method: 'POST' }), d = await r.json();
        if (d.ok) { isRecording = d.recording; var b = document.getElementById('recordToggleBtn'), badge = document.getElementById('recBadge');
          if (isRecording) { b.textContent = '録画停止'; b.className = 'btn btn-danger btn-sm'; badge.style.display = 'inline'; showToast('録画を開始しました'); }
          else { b.textContent = '録画開始'; b.className = 'btn btn-warning btn-sm'; badge.style.display = 'none'; showToast('録画を停止しました'); }
        }
      } catch (e) { showToast('録画制御に失敗しました', 'error'); }
    }
    var analysisRunning = true;
    async function toggleAnalysis() {
      try { var r = await fetch(analysisRunning ? '/api/analysis/pause' : '/api/analysis/resume', { method: 'POST' }), d = await r.json();
        if (d.ok) { analysisRunning = !d.paused; var b = document.getElementById('analysisToggleBtn');
          if (analysisRunning) { b.textContent = '解析停止'; b.className = 'btn btn-danger btn-sm'; showToast('解析を再開しました'); }
          else { b.textContent = '解析再開'; b.className = 'btn btn-success btn-sm'; showToast('解析を停止しました'); }
        }
      } catch (e) { showToast('解析制御に失敗しました', 'error'); }
    }
    /* -- IP Webcam camera controls -- */
    var camState = {};
    async function loadCamControls() {
      try {
        var r = await fetch('/api/ipwebcam/status'), d = await r.json();
        if (!d.ok) return;
        document.getElementById('camControlsCard').style.display = '';
        var cv = d.curvals || {}, av = d.avail || {};
        camState = { torch: cv.torch === 'on', night_vision: cv.night_vision === 'on', ffc: cv.ffc === 'on' };
        updateToggleBtn('torchBtn', camState.torch);
        updateToggleBtn('nightBtn', camState.night_vision);
        updateToggleBtn('ffcBtn', camState.ffc);
        var z = parseInt(cv.zoom) || 100; document.getElementById('zoomSlider').value = z;
        document.getElementById('zoomVal').textContent = (z / 100).toFixed(1) + 'x';
        var q = parseInt(cv.quality) || 50; document.getElementById('qualSlider').value = q;
        document.getElementById('qualVal').textContent = q + '%';
        var sel = document.getElementById('resSelect');
        if (av.video_size) { sel.innerHTML = av.video_size.map(function(s) { return '<option value="' + s + '"' + (s === cv.video_size ? ' selected' : '') + '>' + s + '</option>'; }).join(''); }
      } catch (e) { /* IP Webcam not available */ }
    }
    function updateToggleBtn(id, on) {
      var b = document.getElementById(id);
      if (on) b.classList.add('on'); else b.classList.remove('on');
    }
    async function camSend(path) {
      try { await fetch('/api/ipwebcam/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: path }) }); } catch (e) { showToast('Camera control failed', 'error'); }
    }
    async function camCmd(onPath, offPath, btnId, stateKey) {
      var on = !camState[stateKey];
      await camSend(on ? onPath : offPath);
      camState[stateKey] = on; updateToggleBtn(btnId, on);
    }
    function formatDuration(sec) {
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      if (h > 0) return h + '時間' + m + '分';
      return m + '分';
    }
    async function fetchSleepStatus() {
      try {
        var r = await fetch('/api/sleep/status'), d = await r.json();
        var el = document.getElementById('sleepStatus');
        if (!d.is_sleeping) { el.innerHTML = '<div class="result-item"><span class="result-label">状態</span><span class="result-value">起きている</span></div>'; return; }
        var s = d.current_session, h = '';
        h += '<div class="result-item"><span class="result-label">状態</span><span class="result-value" style="color:var(--accent);font-weight:700">睡眠中</span></div>';
        h += '<div class="result-item"><span class="result-label">寝た時間</span><span class="result-value">' + formatTime(s.start_time) + '</span></div>';
        h += '<div class="result-item"><span class="result-label">経過時間</span><span class="result-value">' + formatDuration(s.duration_seconds) + '</span></div>';
        h += '<div class="result-item"><span class="result-label">スナップショット</span><span class="result-value">' + s.snapshot_count + '枚</span></div>';
        el.innerHTML = h;
      } catch (e) { /* ignore */ }
    }
    async function fetchSleepHistory() {
      try {
        var r = await fetch('/api/sleep/history'), d = await r.json();
        var el = document.getElementById('sleepHistory');
        renderTimeline(d.sessions, d.total_sleep_seconds);
        if (d.sessions.length === 0) { el.innerHTML = ''; return; }
        var h = '';
        if (d.daily_timelapse_available) {
          var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
          var ds = yesterday.toISOString().slice(0, 10);
          h += '<div style="margin-bottom:8px"><a class="action-tag" href="/api/sleep/timelapse/' + ds + '" target="_blank">昨日のタイムラプス</a></div>';
        }
        h += '<div style="font-size:0.85em;color:var(--text-muted);margin-bottom:6px">合計睡眠: ' + formatDuration(d.total_sleep_seconds) + '</div>';
        h += d.sessions.slice(0, 10).map(function(s) {
          var endStr = s.is_active ? '...' : formatTime(s.end_time);
          return '<div class="history-row" style="border-left-color:var(--accent)"><span class="history-row-time">' + formatTime(s.start_time) + '</span>' +
            '<div class="history-row-body"><div class="history-row-summary">' + formatDuration(s.duration_seconds) + '</div>' +
            '<div class="history-row-meta">' + formatTime(s.start_time) + ' - ' + endStr + ' / ' + s.snapshot_count + '枚</div></div></div>';
        }).join('');
        el.innerHTML = h;
      } catch (e) { /* ignore */ }
    }
    function applyControlState(d) {
      streamRunning = d.stream_running;
      analysisRunning = !d.analysis_paused;
      isRecording = d.recording;
      var sb = document.getElementById('streamToggleBtn');
      if (sb) { sb.textContent = streamRunning ? '映像停止' : '映像再開'; sb.className = streamRunning ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'; }
      var ab = document.getElementById('analysisToggleBtn');
      if (ab) { ab.textContent = analysisRunning ? '解析停止' : '解析再開'; ab.className = analysisRunning ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'; }
      var rb = document.getElementById('recordToggleBtn');
      if (rb) { rb.textContent = isRecording ? '録画停止' : '録画開始'; rb.className = isRecording ? 'btn btn-danger btn-sm' : 'btn btn-warning btn-sm'; }
      var badge = document.getElementById('recBadge');
      if (badge) { badge.style.display = isRecording ? 'inline' : 'none'; }
    }
    async function syncControlState() {
      try { var r = await fetch('/api/control/status'), d = await r.json(); applyControlState(d); } catch (e) { /* ignore */ }
    }
    /* -- Preview adjustment (localStorage) -- */
    var PREVIEW_DEFAULTS = { rotate: 90, scale: 100, offsetX: 0, offsetY: 0 };
    function loadPreviewSettings() {
      var saved = localStorage.getItem('mimamori_preview');
      var s = saved ? JSON.parse(saved) : PREVIEW_DEFAULTS;
      document.getElementById('previewRotateSlider').value = s.rotate;
      document.getElementById('previewScaleSlider').value = s.scale;
      document.getElementById('previewOffsetXSlider').value = s.offsetX;
      document.getElementById('previewOffsetYSlider').value = s.offsetY;
      applyPreview(s);
    }
    function applyPreview(s) {
      var frame = document.querySelector('.video-frame');
      frame.style.setProperty('--preview-rotate', s.rotate + 'deg');
      frame.style.setProperty('--preview-scale', s.scale / 100);
      frame.style.setProperty('--preview-offset-x', s.offsetX + '%');
      frame.style.setProperty('--preview-offset-y', s.offsetY + '%');
      document.getElementById('previewRotateVal').textContent = s.rotate + '\u00B0';
      document.getElementById('previewScaleVal').textContent = s.scale + '%';
      document.getElementById('previewOffsetXVal').textContent = s.offsetX;
      document.getElementById('previewOffsetYVal').textContent = s.offsetY;
    }
    function updatePreview() {
      var s = {
        rotate: parseInt(document.getElementById('previewRotateSlider').value),
        scale: parseInt(document.getElementById('previewScaleSlider').value),
        offsetX: parseInt(document.getElementById('previewOffsetXSlider').value),
        offsetY: parseInt(document.getElementById('previewOffsetYSlider').value)
      };
      applyPreview(s);
      localStorage.setItem('mimamori_preview', JSON.stringify(s));
    }
    function resetPreview() {
      localStorage.removeItem('mimamori_preview');
      loadPreviewSettings();
    }
    loadPreviewSettings(); loadSettings(); fetchStatus(); fetchHistory(); fetchSleepStatus(); fetchSleepHistory(); loadCamControls(); syncControlState();
    setInterval(fetchStatus, 5000);
    setInterval(syncControlState, 5000);
    setInterval(function() { if (isDesktop() || currentTab === 'monitor') fetchHistory(); }, 10000);
    setInterval(function() { if (isDesktop() || currentTab === 'sleep') fetchSleepStatus(); }, 10000);
    setInterval(function() { if (isDesktop() || currentTab === 'sleep') fetchSleepHistory(); }, 30000);
  </script>
</body>
